name: Windows Plugin Canary

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Trusted main commit or tag to exercise"
        required: true
        default: "main"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-plugin-canary.yml"
      - "plugins/executor/**"
      - "plugins/codex/**"
      - "plugins/claude-code/**"
  pull_request:
    paths:
      - ".github/workflows/windows-plugin-canary.yml"
      - "plugins/executor/**"
      - "plugins/codex/**"
      - "plugins/claude-code/**"

permissions:
  contents: read

jobs:
  managed-client-bootstrap:
    name: Codex and Claude managed-client bootstrap
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
      - name: Require source from trusted main history
        if: github.event_name != 'pull_request'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The selected release_ref is not part of trusted main history."
          }
      - name: Resolve canary source identity
        id: source
        run: |
          "sha=$(git rev-parse HEAD)" | Add-Content -Path $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/executor/package-lock.json
      - name: Install executor dependencies
        run: npm ci --ignore-scripts --prefix plugins/executor
      - name: Install native host CLIs
        run: npm install --global @openai/codex @anthropic-ai/claude-code
      - name: Verify native host CLIs
        run: |
          codex --version
          claude --version
          "Codex command: $((Get-Command codex).Source)"
          "Claude command: $((Get-Command claude).Source)"
      - name: Run managed-client bootstrap and route canaries
        timeout-minutes: 3
        run: |
          node plugins/executor/tests/windows-managed-client-canary.mjs
          node plugins/executor/tests/windows-managed-client-route-canary.mjs
      - name: Prove secretless browser onboarding
        timeout-minutes: 2
        env:
          STATEWRIGHT_API_KEY: ""
        run: node plugins/executor/tests/windows-plugin-browser-onboarding-canary.mjs
      - name: Run authenticated production gateway canary
        if: github.event_name != 'pull_request'
        env:
          STATEWRIGHT_API_KEY: ${{ secrets.STATEWRIGHT_PLUGIN_CANARY_API_KEY }}
          STATEWRIGHT_GATEWAY_URL: https://mcp.statewright.ai
        run: node plugins/executor/tests/windows-managed-client-live-gateway-canary.mjs
      - name: Record verification boundary
        if: always()
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          @"
          ## Windows plugin canary boundary

          - Requested ref: ``$env:REQUESTED_REF``
          - Resolved source SHA: ``$env:SOURCE_SHA``
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          @'
          This job proves that a Windows-hosted Codex and Claude installation is discovered by the Statewright managed-client bootstrap, receives callable Windows shims, and is enabled in Statewright configuration. It executes the real npm-installed `codex.cmd` and `claude.cmd` launchers through the managed supervisor, then verifies fresh PowerShell profile activation, explicit cmd.exe PATH activation, and native-command restoration after uninstall.

          It also proves that the managed supervisor can run a Windows .cmd launcher through a deterministic Codex route/restart cycle while preserving the quoted route configuration, full continuation prompt, bridge, managed identity, and control-directory lifecycle.

          On trusted `main` pushes and manual dispatches, it also authenticates the executor-owned loopback bridge to production and performs MCP initialization, `tools/list`, and the non-mutating `statewright_get_status` call. A manual source must resolve inside trusted `main` history before the secret-bearing step runs. Pull requests exercise only secretless bootstrap and routing. The key is scoped to the production step and is never exposed to a child host process.

          This does not claim an authenticated interactive Codex or Claude vendor session. That would require vendor credentials and an interactive Windows canary.
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
